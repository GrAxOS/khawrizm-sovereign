services:
  backend:
    build:
      context: ./2_Backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      AI_MODEL: ${AI_MODEL:-llama3.1:8b}
      OLLAMA_URL: http://ollama:11434/api/generate
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1mb}
      MAX_RESPONSE_CHARS: ${MAX_RESPONSE_CHARS:-200000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - backend_network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  ollama_data:
    driver: local

networks:
  backend_network:
    driver: bridge
